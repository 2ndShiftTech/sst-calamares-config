modules-search: [ local ]

instances:
- id: rootfs
  module: unpackfs
  config: unpackfs1.conf
  weight: 45

- id: vmlinuz
  module: unpackfs
  config: unpackfs2.conf
  weight: 5

- id: choice
  module: packages
  config: packages.conf
  weight: 25


sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - summary

- exec:
  - partition
  - mount
  - unpackfs@rootfs
  - unpackfs@vmlinuz
  - machineid
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - luksopenswaphookcfg
  - fstab
  - networkcfg
  - kiro_before
  - kiro_remove_nvidia
  - initcpiocfg
  - initcpio
  - hwclock
  - services-systemd
  - packages@choice
  - displaymanager
  - kiro_ucode
  - grubcfg
  - bootloader
  - kiro_final
  - preservefiles
  - umount

- show:
  - finished


branding: sst

prompt-install: true
dont-chroot: false
oem: true
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false